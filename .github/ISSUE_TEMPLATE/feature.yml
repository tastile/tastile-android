name: Feature request
description: tastile-android への機能追加を提案する。`release-branch-workflow` Skill が canonical 手順。
title: '[feature]: '
labels: ['type/feature']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature

        提案する機能の user value、acceptance criteria、scope / non-scope を記入する。
        `project-board` Skill が必須 field を Project に同期する (ADR-0009)。

  - type: dropdown
    id: priority
    attributes:
      label: Priority (ADR-0009)
      description: P0 = current sprint、 P1 = next sprint、 P2+ = backlog
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size (ADR-0009)
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true

  - type: input
    id: target_version
    attributes:
      label: Target Release (release-x-y-z 形式)
      placeholder: 'release-0-4-0'
    validations:
      required: false

  - type: checkboxes
    id: area
    attributes:
      label: Area / Component
      options:
        - label: dashboard
        - label: mobile
        - label: account
        - label: design-system
        - label: native
        - label: sync
        - label: release
        - label: docs
        - label: infra

  - type: input
    id: execution_generation
    attributes:
      label: Execution Generation (ADR-0008)
      default: '1'
    validations:
      required: false

  - type: textarea
    id: user_value
    attributes:
      label: User value
      placeholder: |
        誰が、何のときに、何ができて、何ができるようになるかを 1 段落で書く。
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / non-scope
      description: 含むもの / 含まないものを cross-repo contract (web / desktop / core) 視点で書く。
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
    validations:
      required: false
