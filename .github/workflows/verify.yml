name: Verify

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      # Release branch HEADs must be verified by CI: merges to
      # release-* otherwise land without any Verify run (A01).
      - "release-*"
  pull_request:

# Cancel in-progress runs for the same ref when a new push lands.
# Without this, a force-push or follow-up commit queues a second runner
# while the first is still mid-`:app:verify`, wasting CI minutes.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK (NDK 27.1.12297006)
        # setup-android has no `ndk-version` input (it warns and ignores it);
        # install the pinned NDK via `packages`. The obsolete `tools` package
        # was removed upstream, so the action default
        # (`tools platform-tools`) fails sdkmanager with exit 1.
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;27.1.12297006'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Checkout OpenAPI spec submodule
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-openapi
          path: tastile-openapi
          # A04: pin to canonical v1.0.0 freeze (C07 confirmed, R01 status:ready).
          # Do NOT change without an associated plan and the next release's SHA bump.
          ref: b0c781dc18111645324e2abc38621b1564d4c518

      - name: Set verify-only environment configuration
        run: |
          {
            echo 'GOOGLE_WEB_CLIENT_ID=verify-google-web-client-id'
            echo 'GOOGLE_ANDROID_CLIENT_ID=verify-google-android-client-id'
            echo 'WEB_BASE_URL=https://localhost'
            echo 'TASTILE_CORE_URL=http://127.0.0.1:0'
          } >> "$GITHUB_ENV"
          echo 'openapi.input=../tastile-openapi/openapi.yaml' >> gradle.properties

      - name: Run :app:lint explicitly
        # :app:lint is part of `./gradlew verify` but is also a fast feedback
        # signal for M3 / Compose design-system violations. Run it before
        # the full verify so the runner surfaces lint failures with a clear
        # step label rather than buried in the umbrella task.
        run: ./gradlew :app:lintDebug

      - name: Verify repository quality gates
        run: ./gradlew verify

  # PR-required interaction canary (QuickCreate gesture arbitration).
  #
  # Runs ONLY the filtered canary class — not the whole androidTest suite —
  # on a single API 35 emulator (ubuntu-latest + KVM, hardware-accelerated,
  # same shape as android/platform-samples' build.yml). The canary sends
  # true platform pointer input (UiAutomator click at display coordinates)
  # so ModalBottomSheet drag-vs-tap arbitration is exercised; Compose
  # semantics performClick() alone cannot catch that failure class.
  #
  # After this lands, mark `android-interaction-canary` as a required status
  # check on the release branches: a PR that breaks the critical user journey
  # must not merge even when `./gradlew verify` is green.
  #
  # Failure evidence uploaded on every run: connected-test reports +
  # androidTest results + logcat + on-device canary screenshots/hierarchy.
  android-interaction-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Checkout OpenAPI spec submodule
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-openapi
          path: tastile-openapi
          # Same canonical v1.0.0 freeze as the unit-tests job. Do NOT change
          # without an associated plan and the next release's SHA bump.
          ref: b0c781dc18111645324e2abc38621b1564d4c518

      - name: Set verify-only environment configuration
        run: |
          {
            echo 'GOOGLE_WEB_CLIENT_ID=verify-google-web-client-id'
            echo 'GOOGLE_ANDROID_CLIENT_ID=verify-google-android-client-id'
            echo 'WEB_BASE_URL=https://localhost'
            echo 'TASTILE_CORE_URL=http://127.0.0.1:0'
          } >> "$GITHUB_ENV"
          echo 'openapi.input=../tastile-openapi/openapi.yaml' >> gradle.properties

      - name: Confirm KVM is available
        run: |
          ls -la /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo

      # The emulator-runner action falls back to `-accel off` (software
      # rendering: 15+ min boot, ANR dialogs that swallow taps) unless the
      # runner user can write /dev/kvm. This is the documented prerequisite
      # (reactivecircus/android-emulator-runner README: "Enable KVM").
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run QuickCreate gesture canary on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            # Install FIRST so the evidence dir can be pulled while the app is
            # still installed: :app:connectedDebugAndroidTest uninstalls both
            # APKs when it finishes, which would delete on-device screenshots.
            # NOTE: --tests is not supported for connectedAndroidTest tasks;
            # filter via the instrumentation runner argument instead.
            # NOTE 2: this runner executes the script LINE BY LINE (each via
            # its own `sh -c`), so NO shell variables, NO backslash
            # continuations, NO multi-line pipes. Cross-line state goes
            # through files ($GITHUB_WORKSPACE) only.
            adb logcat -c
            adb logcat -v time > "$GITHUB_WORKSPACE/logcat-canary.txt" &
            ./gradlew :app:installDebug :app:installDebugAndroidTest
            adb shell am instrument -w -e class app.tastile.android.ui.navigation.QuickCreateGestureCanaryTest app.tastile.android.test/app.tastile.android.util.TastileTestRunner > "$GITHUB_WORKSPACE/instrument-canary.txt" 2>&1; echo -n $? > "$GITHUB_WORKSPACE/instrument.status"
            adb pull /sdcard/Android/data/app.tastile.android/files/canary "$GITHUB_WORKSPACE/canary-evidence" || true
            # Bracket trick: a plain "logcat -v time" pattern matches this
            # very wrapper (`sh -c pkill -f ...`) and kills it (exit null).
            pkill -f "[l]ogcat -v time" || true
            ./gradlew :app:uninstallAll
            exit $(cat "$GITHUB_WORKSPACE/instrument.status")

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-canary-evidence
          if-no-files-found: warn
          path: |
            logcat-canary.txt
            instrument-canary.txt
            canary-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
