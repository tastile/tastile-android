name: Migrate Android secrets to Infisical

on:
  push:
    branches: ['41']

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: android-secret-migration
    steps:
      - name: Copy GitHub secrets directly to Infisical
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          TASTILE_CORE_URL: ${{ secrets.TASTILE_CORE_URL }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          INFISICAL_DOMAIN: https://secrets.rebuildup.dev
          INFISICAL_PROJECT_ID: 364ed86a-5367-4e56-8d73-f06e00911eb5
          INFISICAL_IDENTITY_ID: 01fd87de-0637-4a0d-8c6f-5b599e96c102
        shell: bash
        run: |
          set -euo pipefail

          jwt="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Ftastile" \
            | jq --exit-status --raw-output '.value')"
          login_body="$(jq --null-input \
            --arg identityId "$INFISICAL_IDENTITY_ID" \
            --arg jwt "$jwt" \
            '{identityId: $identityId, jwt: $jwt}')"
          export INFISICAL_TOKEN="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$login_body" \
            "${INFISICAL_DOMAIN}/api/v1/auth/oidc-auth/login" \
            | jq --exit-status --raw-output '.accessToken')"

          node <<'NODE'
          (async () => {
          const secrets = [
            ["ANDROID_KEYSTORE_BASE64", "prod", "/release"],
            ["ANDROID_KEYSTORE_PASSWORD", "prod", "/release"],
            ["ANDROID_KEY_ALIAS", "prod", "/release"],
            ["ANDROID_KEY_PASSWORD", "prod", "/release"],
            ["GOOGLE_ANDROID_CLIENT_ID", "prod", "/release"],
            ["GOOGLE_WEB_CLIENT_ID", "prod", "/release"],
            ["TASTILE_CORE_URL", "prod", "/release"],
            ["WEB_BASE_URL", "prod", "/release"],
            ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON", "prod", "/google-play"],
            ["GOOGLE_ANDROID_CLIENT_ID", "dev", "/"],
            ["GOOGLE_WEB_CLIENT_ID", "dev", "/"],
            ["TASTILE_CORE_URL", "dev", "/"],
            ["WEB_BASE_URL", "dev", "/"],
          ];

          const { INFISICAL_DOMAIN, INFISICAL_PROJECT_ID, INFISICAL_TOKEN } = process.env;

          for (const [name, environment, secretPath] of secrets) {
            const secretValue = process.env[name];
            if (!secretValue) throw new Error(`GitHub secret ${name} is empty or unavailable`);

            const query = new URLSearchParams({
              workspaceId: INFISICAL_PROJECT_ID,
              environment,
              secretPath,
            });
            const endpoint = `${INFISICAL_DOMAIN}/api/v3/secrets/raw/${encodeURIComponent(name)}`;
            const headers = { Authorization: `Bearer ${INFISICAL_TOKEN}` };
            const lookup = await fetch(`${endpoint}?${query}`, { headers });
            if (lookup.status !== 200 && lookup.status !== 404) {
              throw new Error(`Infisical lookup for ${name} failed with HTTP ${lookup.status}`);
            }

            const response = await fetch(endpoint, {
              method: lookup.status === 404 ? "POST" : "PATCH",
              headers: { ...headers, "Content-Type": "application/json" },
              body: JSON.stringify({
                workspaceId: INFISICAL_PROJECT_ID,
                environment,
                secretPath,
                secretValue,
                type: "shared",
                skipMultilineEncoding: true,
              }),
            });
            if (!response.ok) {
              throw new Error(`Infisical write for ${name} failed with HTTP ${response.status}`);
            }
            process.stdout.write(`Migrated ${name} to ${environment}:${secretPath}\n`);
          }

          for (const [name, environment, secretPath] of secrets) {
            const query = new URLSearchParams({
              workspaceId: INFISICAL_PROJECT_ID,
              environment,
              secretPath,
            });
            const response = await fetch(`${INFISICAL_DOMAIN}/api/v3/secrets/raw?${query}`, {
              headers: { Authorization: `Bearer ${INFISICAL_TOKEN}` },
            });
            if (!response.ok) throw new Error(`Infisical verification failed with HTTP ${response.status}`);
            const payload = await response.json();
            const imported = payload.secrets?.find((secret) => secret.secretKey === name);
            if (imported?.secretValue !== process.env[name]) {
              throw new Error(`Infisical value mismatch for ${name} in ${environment}:${secretPath}`);
            }
          }
          process.stdout.write(`Verified ${secrets.length} Android secret placements without displaying values.\n`);
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
