name: Security advisory intake

# Manual / dispatched intake that opens a labelled GitHub Issue from an
# advisory (ADR-style). The workflow itself takes no GitHub secrets — issue
# creation uses the workflow's `GITHUB_TOKEN` with the minimum scope.
#
# Trigger:
#   - workflow_dispatch: contributors paste severity / title / cve / summary
#   - repository_dispatch: types: [advisory_received] from a separate bot or
#     a Security Advisory webhook (not configured here to avoid extra secrets)
#
# The opened Issue becomes the durable work item; subsequent release
# assignment is handled via `release-branch-workflow` Skill + ADR-0009.

on:
  workflow_dispatch:
    inputs:
      severity:
        description: Severity bucket
        required: true
        type: choice
        options:
          - critical
          - important
          - info
      title:
        description: Short title (no prefix)
        required: true
        type: string
      ghsa_or_cve:
        description: 'GHSA / CVE id (optional)'
        required: false
        type: string
        default: ''
      summary:
        description: One-paragraph summary
        required: true
        type: string
  repository_dispatch:
    types: [advisory_received]

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    name: Open Issue from advisory
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and open Issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fromDispatch = !!context.payload.advisory;
            let severity, title, ghsaOrCve, summary;
            if (fromDispatch) {
              const adv = context.payload.advisory || {};
              severity = (adv.severity || 'info').toLowerCase();
              title = adv.title || 'untitled advisory';
              ghsaOrCve = adv.ghsa || adv.cve || '';
              summary = adv.summary || 'See SECURITY.md for the reporting path.';
            } else {
              const inputs = context.payload.inputs || {};
              severity = inputs.severity;
              title = inputs.title;
              ghsaOrCve = inputs.ghsa_or_cve || '';
              summary = inputs.summary;
            }
            const lines = [
              '## Security advisory intake',
              '',
              '- Severity: `' + severity + '`',
            ];
            if (ghsaOrCve) { lines.push('- ID: `' + ghsaOrCve + '`'); }
            lines.push('');
            lines.push(summary);
            lines.push('');
            lines.push('See `SECURITY.md` for the reporting path. After this Issue is opened, link it from');
            lines.push('a `release-x-y-z` branch via the `release-branch-workflow` Skill and apply');
            lines.push('ADR-0007 / ADR-0009 (`priority` / `size` / `target_version` / `execution_generation`).');
            const body = lines.join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[security advisory] ' + title,
              body,
              labels: ['type/security-advisory', 'severity/' + severity]
            });
            core.info('opened #' + issue.data.number);
