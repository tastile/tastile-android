name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      track:
        description: "Play track"
        default: "internal"
        type: choice
        options: [internal, beta, production]

# A release is bound to a single tag + workflow_dispatch run; cancel stale
# runs for the same ref so a re-run after a transient failure does not
# double-upload AABs / Play Store assets.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK (compile SDK 37, NDK 27.1.12297006)
        # android-actions/setup-android@v3's `accept-android-sdk-licenses: true`
        # hangs on the preview SDK license (License 4/6 = android-sdk-preview-license).
        # Doing it in bash lets us install cmdline-tools, accept ALL licenses
        # (including preview), then install packages — in that order.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            # 13114758 = cmdline-tools 19.0 + Android API 37 preview repository.
            # 11076708 (older) does not have android-37 in its package list.
            curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q commandlinetools-linux-*_latest.zip
            rm commandlinetools-linux-*_latest.zip
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Accept every pending license (incl. preview). The preview SDK
          # license needs multiple yes passes — run twice to be safe.
          yes | sdkmanager --licenses || true
          yes | sdkmanager --licenses
          # The API 37 platform ships as `platforms;android-37.0` (minor-versioned
          # path, stable channel). `platforms;android-37` does not exist in
          # Google's repository2-3.xml and makes sdkmanager abort the whole
          # install with "Failed to find package".
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate signing and Play credentials
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.jks
          test -s /tmp/keystore.jks

      - name: Validate release source (tag → commit reachability)
        env:
          TAG: ${GITHUB_REF_NAME}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Verifying release source '${TAG}'..."
          REACHABLE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TAG}~1...${TAG}" --jq '.status' 2>&1 || true)
          if [ "${REACHABLE}" != "ahead" ] && [ "${REACHABLE}" != "identical" ]; then
            echo "::error::Release source '${TAG}' is not a valid commit/ref (status=${REACHABLE})."
            exit 1
          fi
          BRANCHES=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}/branches-where-head" --jq '.[].name' 2>&1 || true)
          echo "Branches where source is HEAD: ${BRANCHES}"
          if ! echo "${BRANCHES}" | grep -qE '^(main|release-[0-9]+-[0-9]+-[0-9]+)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tastile/tastile-openapi
          path: tastile-openapi
          # A04: pin to canonical v1.0.0 freeze (C07 confirmed, R01 status:ready).
          # Do NOT change without an associated plan and the next release's SHA bump.
          ref: b0c781dc18111645324e2abc38621b1564d4c518

      - name: Write gradle.properties from Secrets
        run: |
          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=/tmp/keystore.jks
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}
          TASTILE_CORE_URL=${{ secrets.TASTILE_CORE_URL }}
          openapi.input=../tastile-openapi/openapi.yaml
          EOF

      - name: Verify repository quality gates
        run: ./gradlew verify

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: dist/
          if-no-files-found: error

  upload-play:
    needs: build-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-release
          path: dist/

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.tastile.android
          releaseFiles: dist/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          mappingFile: dist/mapping.txt

  upload-github-release:
    needs: build-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-release
          path: dist/

      - name: Upload AAB to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-aab.outputs.version }}
          TAG_NAME: v${{ needs.build-aab.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/app-release.aab dist/mapping.txt --clobber
          else
            gh release create "$TAG_NAME" \
              dist/app-release.aab dist/mapping.txt \
              --title "$TAG_NAME" --generate-notes
          fi
; then
            echo "::error::Release source '${TAG}' must be HEAD of main or release-* (got: ${BRANCHES})."
            exit 1
          fi

      - name: Checkout OpenAPI spec submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tastile/tastile-openapi
          path: tastile-openapi
          # A04: pin to canonical v1.0.0 freeze (C07 confirmed, R01 status:ready).
          # Do NOT change without an associated plan and the next release's SHA bump.
          ref: b0c781dc18111645324e2abc38621b1564d4c518

      - name: Write gradle.properties from Secrets
        run: |
          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=/tmp/keystore.jks
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}
          TASTILE_CORE_URL=${{ secrets.TASTILE_CORE_URL }}
          openapi.input=../tastile-openapi/openapi.yaml
          EOF

      - name: Verify repository quality gates
        run: ./gradlew verify

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: dist/
          if-no-files-found: error

  upload-play:
    needs: build-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-release
          path: dist/

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.tastile.android
          releaseFiles: dist/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          mappingFile: dist/mapping.txt

  upload-github-release:
    needs: build-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-release
          path: dist/

      - name: Upload AAB to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-aab.outputs.version }}
          TAG_NAME: v${{ needs.build-aab.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/app-release.aab dist/mapping.txt --clobber
          else
            gh release create "$TAG_NAME" \
              dist/app-release.aab dist/mapping.txt \
              --title "$TAG_NAME" --generate-notes
          fi
