name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      track:
        description: "Play track"
        default: "internal"
        type: choice
        options: [internal, beta, production]

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK (compile SDK 37, NDK 27.1.12297006)
        # android-actions/setup-android@v3's `accept-android-sdk-licenses: true`
        # hangs on the preview SDK license (License 4/6 = android-sdk-preview-license).
        # Doing it in bash lets us install cmdline-tools, accept ALL licenses
        # (including preview), then install packages — in that order.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            # 13114758 = cmdline-tools 19.0 + Android API 37 preview repository.
            # 11076708 (older) does not have android-37 in its package list.
            curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q commandlinetools-linux-*_latest.zip
            rm commandlinetools-linux-*_latest.zip
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Accept every pending license (incl. preview). The preview SDK
          # license needs multiple yes passes — run twice to be safe.
          # --channel=3 (Canary) is required to find the preview channel package
          # list that contains `platforms;android-37` (Android 16 preview). The
          # default channel (stable=0) lists it as "package not found" and
          # aborts the install before any package gets downloaded.
          yes | sdkmanager --channel=3 --licenses || true
          yes | sdkmanager --channel=3 --licenses
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate signing and Play credentials
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_GCM_SENDER_ID: ${{ secrets.FIREBASE_GCM_SENDER_ID }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT"
          test -n "$FIREBASE_APPLICATION_ID"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_GCM_SENDER_ID"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.jks
          test -s /tmp/keystore.jks

      - name: Write gradle.properties from Secrets
        run: |
          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=/tmp/keystore.jks
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REGION=${{ secrets.COGNITO_REGION }}
          COGNITO_HOSTED_UI_DOMAIN=${{ secrets.COGNITO_HOSTED_UI_DOMAIN }}
          COGNITO_REDIRECT_URI=${{ secrets.COGNITO_REDIRECT_URI }}
          COGNITO_WEB_AUTH_BASE_URL=${{ secrets.COGNITO_WEB_AUTH_BASE_URL }}
          TASTILE_CORE_URL=${{ secrets.TASTILE_CORE_URL }}
          FIREBASE_APPLICATION_ID=${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_GCM_SENDER_ID=${{ secrets.FIREBASE_GCM_SENDER_ID }}
          EOF

      - name: Verify repository quality gates
        run: ./gradlew verify

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/
          if-no-files-found: error

  upload-play:
    needs: build-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.tastile.android
          releaseFiles: dist/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          mappingFile: dist/mapping.txt

  upload-github-release:
    needs: build-aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/

      - name: Upload AAB to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-aab.outputs.version }}
          TAG_NAME: v${{ needs.build-aab.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/app-release.aab dist/mapping.txt --clobber
          else
            gh release create "$TAG_NAME" \
              dist/app-release.aab dist/mapping.txt \
              --title "$TAG_NAME" --generate-notes
          fi
