name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      track:
        description: "Play track"
        default: "internal"
        type: choice
        options: [internal, beta, production]

# A release is bound to a single tag + workflow_dispatch run; cancel stale
# runs for the same ref so a re-run after a transient failure does not
# double-upload AABs / Play Store assets.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-aab:
    environment: android-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Android release settings from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          environment: prod
          path: /

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK (compile SDK 37, NDK 27.1.12297006)
        # android-actions/setup-android@v3's `accept-android-sdk-licenses: true`
        # hangs on the preview SDK license (License 4/6 = android-sdk-preview-license).
        # Doing it in bash lets us install cmdline-tools, accept ALL licenses
        # (including preview), then install packages — in that order.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            # 13114758 = cmdline-tools 19.0 + Android API 37 preview repository.
            # 11076708 (older) does not have android-37 in its package list.
            curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q commandlinetools-linux-*_latest.zip
            rm commandlinetools-linux-*_latest.zip
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Accept every pending license (incl. preview). The preview SDK
          # license needs multiple yes passes — run twice to be safe.
          yes | sdkmanager --licenses || true
          yes | sdkmanager --licenses
          # The API 37 platform ships as `platforms;android-37.0` (minor-versioned
          # path, stable channel). `platforms;android-37` does not exist in
          # Google's repository2-3.xml and makes sdkmanager abort the whole
          # install with "Failed to find package".
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate signing and Android build configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_WEB_CLIENT_ID"
          test -n "$GOOGLE_ANDROID_CLIENT_ID"
          test -n "$WEB_BASE_URL"
          test -n "$TASTILE_CORE_URL"

      - name: Decode keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          test -s /tmp/keystore.jks
          echo 'RELEASE_STORE_FILE=/tmp/keystore.jks' >> "$GITHUB_ENV"

      - name: Checkout OpenAPI spec submodule
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-openapi
          path: tastile-openapi
          # A04: pin to canonical v1.0.0 freeze (C07 confirmed, R01 status:ready).
          # Do NOT change without an associated plan and the next release's SHA bump.
          ref: b0c781dc18111645324e2abc38621b1564d4c518

      - name: Set OpenAPI spec path
        run: echo 'openapi.input=../tastile-openapi/openapi.yaml' >> gradle.properties

      - name: Verify repository quality gates
        run: ./gradlew verify

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/
          if-no-files-found: error

  upload-play:
    needs: build-aab
    environment: android-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/

      - name: Fetch Google Play credential from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /
          secret-name: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON

      - name: Prepare Google Play credential input
        id: play-credential
        shell: bash
        run: |
          {
            echo 'json<<INFISICAL_PLAY_CREDENTIAL'
            printf '%s\n' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            echo 'INFISICAL_PLAY_CREDENTIAL'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.play-credential.outputs.json }}
          packageName: app.tastile.android
          releaseFiles: dist/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          mappingFile: dist/mapping.txt

  upload-github-release:
    needs: build-aab
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/

      - name: Upload AAB to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-aab.outputs.version }}
          TAG_NAME: v${{ needs.build-aab.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/app-release.aab dist/mapping.txt --clobber
          else
            gh release create "$TAG_NAME" \
              dist/app-release.aab dist/mapping.txt \
              --title "$TAG_NAME" --generate-notes
          fi
