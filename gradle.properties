android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Xshare:off
kotlin.daemon.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Xshare:off
android.jdk.image.transformation.enabled=false
android.experimental.jdk.image.transformation.enabled=false
# Required by KSP+Hilt until they migrate to AGP 9 built-in Kotlin source-set APIs:
# without this the configuration phase fails with "Using kotlin.sourceSets DSL to
# add Kotlin sources is not allowed with built-in Kotlin" on the KSP-generated
# `kotlin`/`java` directories under `app/build/generated/ksp/debug/`.
# AGP marks the property as "experimental" precisely because it is a temporary
# escape hatch; the warning is not actionable until KSP ships an AGP-9-compatible
# release.
android.disallowKotlinSourceSets=false
# kotlin.incremental.useClasspathSnapshot was removed in KGP 2.1.0 — the KGP
# uses ABI snapshots by default and the property is unsupported.

# JDK toolchain: CI uses actions/setup-java JDK 21. Local builds pick up
# JDK 17 from JAVA_HOME after the setup script strips Oracle Java 8 from
# PATH (see scripts/setup-jdk17.sh). Do NOT pin a platform-specific path
# here — the Linux CI runner cannot resolve a Windows JDK location.

# Publishable mobile client configuration is loaded from Infisical at build time.
# Do not put release credentials or machine-specific configuration in this file.
#
# Each value MUST be supplied by Infisical or CI (see .github/workflows/).
# The build fails fast if any required
# property is blank — see the `gradle.projectsEvaluated` guard in
# app/build.gradle.kts. Keep the names here as a reminder; the values stay out.
#
# GOOGLE_WEB_CLIENT_ID=                        # Google Identity OAuth web client ID
# GOOGLE_ANDROID_CLIENT_ID=                    # Google Identity OAuth Android client ID
# WEB_BASE_URL=                               # Public web origin serving /api/auth/* (e.g. https://app.tastile.app)
# TASTILE_CORE_URL=                           # Public API base for the v1 backend (e.g. https://api.tastile.app)

# OpenAPI cross-repo canonical spec. The path is resolved relative to the
# `app/` module's projectDir, so ../../openapi/openapi.yaml points at the
# workspace-shell submodule at tastile-root/openapi/. The build fails fast
# (app/build.gradle.kts: `error("openapi.input is not set ...")`) if this
# property is missing or blank. Override locally for spec branch work:
#   ./gradlew :app:generateV1Api -Popenapi.input=/path/to/openapi.yaml
openapi.input=../../openapi/openapi.yaml
